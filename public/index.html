<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Daily Grind</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #fff8fb;
      color: #111111;
    }

    header {
      background-color: #000000;
      color: white;
      text-align: center;
      padding: 24px;
    }

    header h2 {
      color: #ff1493;
      margin-bottom: 12px;
    }

    nav a {
      color: #81e6d9;
      text-decoration: none;
      margin: 0 12px;
      font-weight: bold;
    }

    main {
      max-width: 750px;
      margin: 60px auto;
      padding: 35px;
      text-align: center;
      background-color: white;
      border: 3px solid #ffb6d9;
      border-radius: 16px;
    }

    h1 {
      color: #ff1493;
      font-family: "Bodoni 72", Didot, Georgia, serif;
      font-size: 4rem;
      font-weight: 800;
      font-style: italic;
      letter-spacing: 1px;
      text-shadow: 2px 2px 0 #ffb6d9;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
    }

    .button {
      display: inline-block;
      margin-top: 18px;
      padding: 12px 20px;
      background-color: #ff1493;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #555555;
    }
  </style>
</head>

<body>
  <header>
    <h2>The Daily Grind</h2>

    <nav>
      <a href="/">Home</a>
      <a href="/contact">Contact</a>
    </nav>
  </header>

  <main>
    <h1>Welcome to The Daily Grind!</h1>

    <p>
      The Daily Grind is your neighborhood coffee shop for fresh coffee,
      friendly conversations, spades, backgammon and chess, and a comfortable
      place to relax. Good Vibes Only!!
    </p>

    <a class="button" href="/contact">Contact Us</a>
  </main>

  <footer>
    <p>The Daily Grind Coffee Shop</p>
  </footer>
</body>
</html>
